<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Meenachi Grocery</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body style="background: var(--bg-warm); min-height: 100vh; display: flex; flex-direction: column;">
<header class="site-header">
  <div class="container">
    <div class="header-main" style="justify-content: center;">
      <a href="../index.html" class="brand-logo">
        <svg class="brand-icon-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="12" fill="#19583B" />
          <path
            d="M13 18C13 16.8954 13.8954 16 15 16H33C34.1046 16 35 16.8954 35 18L36.8 34.2C36.9189 35.2701 36.0754 36.2 35 36.2H13C11.9246 36.2 11.0811 35.2701 11.2 34.2L13 18Z"
            fill="#FFFFFF" />
          <path d="M19 16V13C19 10.2386 21.2386 8 24 8C26.7614 8 29 10.2386 29 13V16" stroke="#E99A38" stroke-width="3"
            stroke-linecap="round" />
          <path d="M24 20C24 13 32 10.5 35 10C34.5 14 31 20 24 20Z" fill="#E99A38" />
          <path d="M24 20C24 15 18 13.5 15 13C15.5 16.5 18.5 20 24 20Z" fill="#29B06A" />
        </svg>
        <div class="brand-text-block">
          <span class="brand-name">Meenachi</span>
          <span class="brand-tagline">Freshness at Your Doorstep</span>
        </div>
      </a>
    </div>
  </div>
</header>

<main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
  <div
    style="background: #FFFFFF; border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 36px; max-width: 440px; width: 100%; box-shadow: var(--shadow-md);">
    <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--primary); margin-bottom: 6px;">Sign In to Your Account
    </h1>
    <p style="font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 24px;">Access saved delivery addresses,
      order tracking, and member discounts</p>

    <form onsubmit="handleCustomerLogin(event)">
      <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px;">
        <label style="font-size: 0.82rem; font-weight: 700;">Email Address</label>
        <input type="email" id="loginEmail" class="form-input"
          style="padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 8px;"
          placeholder="name@example.com" required>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px;">
        <div style="display: flex; justify-content: space-between;">
          <label style="font-size: 0.82rem; font-weight: 700;">Password</label>
          <a href="#" style="font-size: 0.78rem; color: var(--primary);">Forgot Password?</a>
        </div>
        <input type="password" id="loginPassword" class="form-input"
          style="padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 8px;"
          placeholder="Enter password" required>
      </div>

      <button type="submit" id="loginSubmitBtn" class="btn-primary"
        style="width: 100%; justify-content: center; padding: 12px;">
        Sign In ➔
      </button>

      <div id="loginFeedback" style="font-size: 0.82rem; text-align: center; margin-top: 14px;"></div>
    </form>

    <div
      style="text-align: center; border-top: 1px solid var(--border-light); padding-top: 20px; margin-top: 24px; font-size: 0.86rem;">
      New to Meenachi Grocery? <a href="register.html" style="font-weight: 700; color: var(--primary);">Create
        Account</a>
    </div>
  </div>
</main>

<script type="module" src="../js/supabaseClient.js"></script>
<script src="../js/dbService.js"></script>
<script>
  async function handleCustomerLogin(e) {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const feedback = document.getElementById("loginFeedback");
    const btn = document.getElementById("loginSubmitBtn");

    btn.disabled = true;
    btn.textContent = "Authenticating...";
    feedback.textContent = "";

    if (window.dbService) {
      const { data, error } = await window.dbService.signIn(email, password);
      if (error) {
        feedback.style.color = "#DC3545";
        feedback.textContent = error.message || "Failed to sign in. Please verify your credentials.";
        btn.disabled = false;
        btn.textContent = "Sign In ➔";
        return;
      }
    }

    feedback.style.color = "#198754";
    feedback.textContent = "✅ Signed in successfully! Redirecting...";
    setTimeout(() => {
      window.location.href = "account.html";
    }, 1000);
  }
</script>
</body>

</html>
