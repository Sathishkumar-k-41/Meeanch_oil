<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | Meenachi Grocery</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .order-history-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-xs);
    }
    .order-head-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 14px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .timeline-steps {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin: 24px 0 20px;
    }
    .timeline-steps::before {
      content: '';
      position: absolute;
      top: 14px;
      left: 20px;
      right: 20px;
      height: 3px;
      background: var(--border-color);
      z-index: 1;
    }
    .timeline-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
      text-align: center;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
    }
    .step-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 3px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
      font-size: 0.75rem;
    }
    .timeline-step.completed .step-circle {
      border-color: var(--primary);
      background: var(--primary);
      color: #FFFFFF;
    }
    .timeline-step.completed {
      color: var(--primary);
    }
    .timeline-step.active .step-circle {
      border-color: var(--accent);
      background: #FFFFFF;
      color: var(--accent);
    }
    .timeline-step.active {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="header-main">
        <a href="../index.html" class="brand-logo">
          <svg class="brand-icon-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="48" height="48" rx="12" fill="#19583B"/>
            <path d="M13 18C13 16.8954 13.8954 16 15 16H33C34.1046 16 35 16.8954 35 18L36.8 34.2C36.9189 35.2701 36.0754 36.2 35 36.2H13C11.9246 36.2 11.0811 35.2701 11.2 34.2L13 18Z" fill="#FFFFFF"/>
            <path d="M19 16V13C19 10.2386 21.2386 8 24 8C26.7614 8 29 10.2386 29 13V16" stroke="#E99A38" stroke-width="3" stroke-linecap="round"/>
            <path d="M24 20C24 13 32 10.5 35 10C34.5 14 31 20 24 20Z" fill="#E99A38"/>
            <path d="M24 20C24 15 18 13.5 15 13C15.5 16.5 18.5 20 24 20Z" fill="#29B06A"/>
          </svg>
          <div class="brand-text-block">
            <span class="brand-name">Meenachi</span>
            <span class="brand-tagline">My Orders</span>
          </div>
        </a>
        <a href="../index.html" class="action-btn">🏠 Home</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 32px 20px; max-width: 860px;">
    <h1 class="section-title">Order History & Live Status</h1>
    <p class="section-subtitle">Track your delivery progress, view invoices, or re-order your previous grocery baskets</p>

    <div id="ordersContainer" style="margin-top: 24px;"></div>
  </main>

  <script type="module" src="../js/supabaseClient.js"></script>
  <script src="../js/dbService.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await renderOrders();
    });

    async function renderOrders() {
      const container = document.getElementById("ordersContainer");
      let orders = [];

      if (window.dbService) {
        orders = await window.dbService.getOrders();
      } else {
        orders = JSON.parse(localStorage.getItem("meenachi_orders") || "[]");
      }

      // Seed with a sample realistic previous order if list is empty
      if (!orders || orders.length === 0) {
        orders = [{
          orderId: "MG-842915",
          date: "Yesterday, 11:30 AM",
          customer: { name: "Meenakshi Sundaram", address: "Anna Nagar, Chennai - 600040" },
          slot: "2-Hour Express Delivery",
          status: "Delivered",
          total: 895,
          items: [
            { nameEn: "Meenachi Premium Ponni Boiled Rice", unit: "5 kg", quantity: 1, price: 340 },
            { nameEn: "Meenachi Wood Pressed Sesame Oil", unit: "1 L", quantity: 1, price: 375 },
            { nameEn: "Unpolished Country Toor Dal", unit: "1 kg", quantity: 1, price: 168 }
          ]
        }];
        localStorage.setItem("meenachi_orders", JSON.stringify(orders));
      }

      container.innerHTML = orders.map(order => `
        <div class="order-history-card">
          <div class="order-head-bar">
            <div>
              <span style="font-size: 1.15rem; font-weight: 800; color: var(--primary);">Order #${order.orderId}</span>
              <div style="font-size: 0.78rem; color: var(--text-muted);">${order.date} • ${order.slot}</div>
            </div>
            <div>
              <span style="background: var(--primary-light); color: var(--primary); font-weight: 700; padding: 4px 12px; border-radius: var(--radius-full); font-size: 0.8rem;">
                ● ${order.status}
              </span>
            </div>
          </div>

          <!-- Timeline -->
          <div class="timeline-steps">
            <div class="timeline-step completed">
              <div class="step-circle">✓</div>
              <span>Placed</span>
            </div>
            <div class="timeline-step completed">
              <div class="step-circle">✓</div>
              <span>Confirmed</span>
            </div>
            <div class="timeline-step ${order.status === 'Delivered' ? 'completed' : 'active'}">
              <div class="step-circle">${order.status === 'Delivered' ? '✓' : '📦'}</div>
              <span>Packed</span>
            </div>
            <div class="timeline-step ${order.status === 'Delivered' ? 'completed' : ''}">
              <div class="step-circle">${order.status === 'Delivered' ? '✓' : '🚚'}</div>
              <span>Dispatched</span>
            </div>
            <div class="timeline-step ${order.status === 'Delivered' ? 'completed' : ''}">
              <div class="step-circle">${order.status === 'Delivered' ? '✓' : '🏠'}</div>
              <span>Delivered</span>
            </div>
          </div>

          <!-- Items in order -->
          <div style="border-top: 1px dashed var(--border-light); padding-top: 12px; margin-top: 12px;">
            ${order.items.map(i => `
              <div style="display: flex; justify-content: space-between; font-size: 0.86rem; margin-bottom: 6px;">
                <span>${i.nameEn} (${i.unit}) × <strong>${i.quantity}</strong></span>
                <span style="font-weight: 700;">₹${i.price * i.quantity}</span>
              </div>
            `).join("")}
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-light); padding-top: 12px; margin-top: 12px;">
            <div>
              <span style="font-size: 0.78rem; color: var(--text-secondary);">Total Paid:</span>
              <span style="font-size: 1.18rem; font-weight: 800; color: var(--primary); margin-left: 6px;">₹${order.total}</span>
            </div>
            <button type="button" class="btn-primary" style="padding: 8px 16px; font-size: 0.82rem;" onclick="repeatOrder('${order.orderId}')">
              🔁 Repeat This Order
            </button>
          </div>
        </div>
      `).join("");
    }

    function repeatOrder(orderId) {
      const orders = JSON.parse(localStorage.getItem("meenachi_orders") || "[]");
      const order = orders.find(o => o.orderId === orderId);
      if (!order) return;

      order.items.forEach(item => {
        window.cart.addItem(item, null, item.quantity);
      });

      alert("All items from this order have been added to your cart!");
      window.location.href = "shop.html";
    }
  </script>
</body>
</html>
